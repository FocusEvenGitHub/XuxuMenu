<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card&aacute;pio - Cozinha da Xuxu</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cardapio.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/print.css">
</head>
<body>
<main class="cardapio">
    <header class="topo">
        <h1 class="titulo-principal" id="tituloCardapio">Card&aacute;pio</h1>
        <div class="logo">
            <div>
                <img src="img/logo.png" alt="Logo" width="200" height="200">
            </div>
        </div>
    </header>

    <section class="cards-centro cards-6">

        <!-- ============ PRATO DO DIA ============ -->
        <article class="card-produto card-destaque" data-id="pratoDia">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <div class="precos-destaque">
                    <p class="preco-destaque">
                        <span class="preco-rotulo">Adulto</span>
                        <span class="rs">R$</span>
                        <strong data-field="price"></strong>
                    </p>
                    <p class="preco-destaque" data-linha="kids">
                        <span class="preco-rotulo">Kids</span>
                        <span class="rs">R$</span>
                        <strong data-field="priceKids"></strong>
                    </p>
                </div>
            </div>
            <div class="foto-card">
                <img data-img="pratoDia" src="img/prato-dia.jpg" alt="Prato do Dia">
            </div>
            <ul class="lista-prato" data-field="ingredients"></ul>
        </article>

        <!-- ============ PICADINHO ============ -->
        <article class="card-produto" data-id="picadinho">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <p data-field="subtitle"></p>
                <p><strong data-field="price"></strong></p>
            </div>
            <div class="foto-card">
                <img data-img="picadinho" src="img/picadinho.png" alt="Picadinho">
            </div>
            <div class="lista-combo" data-field="items"></div>
        </article>

        <!-- ============ PARMEGIANA ============ -->
        <article class="card-produto" data-id="parmegiana">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <div data-field="variants"></div>
            </div>
            <div class="foto-card">
                <img data-img="parmegiana" src="img/parmegiana.png" alt="Parmegiana">
            </div>
            <div class="lista-combo" data-field="items"></div>
        </article>

        <!-- ============ SALADA ============ -->
        <article class="card-produto" data-id="salada">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <div data-field="variants"></div>
            </div>
            <div class="foto-card">
                <img data-img="salada" src="img/salada.png" alt="Salada">
            </div>
            <div class="ingredientes-titulo" data-field="ingredientsTitle"></div>
            <div class="ingredientes-salada" data-field="ingredients"></div>
        </article>

        <!-- ============ LUÍS ============ -->
        <article class="card-produto" data-id="luis">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <div data-field="variants"></div>
            </div>
            <div class="foto-card">
                <img data-img="luis" src="img/luis.png" alt="Lu&iacute;s">
            </div>
            <div class="lista-combo" data-field="items"></div>
        </article>

        <!-- ============ BARÇA ============ -->
        <article class="card-produto" data-id="barca">
            <div class="cabecalho-card">
                <h3 data-field="name"></h3>
                <div data-field="variants"></div>
            </div>
            <div class="foto-card">
                <img data-img="barca" src="img/barca.png" alt="Bar&ccedil;a">
            </div>
            <div class="lista-combo" data-field="items"></div>
        </article>

    </section>

    <!-- ============ RODAPÉ (MONTE SEU PRATO) ============ -->
    <section class="painel rodape">
        <div class="monte-prato">
            <span class="tag-preta" data-field="footer-title"></span>
        </div>
        <div class="adicionais">
            <div class="lista-adicionais" data-field="footer-items"></div>
        </div>
    </section>

</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
